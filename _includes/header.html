<header class="site-header" role="banner">
  <div class="shell shell-wide site-header-inner">
    <a class="brand" rel="author" href="{{ '/' | relative_url }}">
      <span class="brand-mark">{{ site.short_title | default: 'PB' }}</span>
      <span class="brand-copy">
        <span class="brand-name">{{ site.title | escape }}</span>
        <span class="brand-tagline">{{ site.description | escape }}</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a class="nav-link" href="{{ '/' | relative_url }}">Writing</a>
      <a class="nav-link" href="{{ '/about/' | relative_url }}">About</a>
      <a class="nav-link" href="https://github.com/{{ site.github_username | escape }}" target="_blank" rel="noreferrer">GitHub</a>
      <a class="nav-link" href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
</header>
